[project]
name = "spatiality-diff"
version = "0.1.0"
description = "What changed in the room? Two phone videos -> shared 3D scene -> added / removed / moved objects, with labels and evidence."
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "open3d>=0.19",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-ai-slim[google]>=0.4",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "modal>=1.0",
]

[project.optional-dependencies]
# Local GPU/MPS reconstruction. Modal images install the same set, see modal_app.py.
gpu = [
  "torch>=2.4",
  "torchvision>=0.19",
  "huggingface_hub>=0.25",
  "einops",
  "safetensors",
]
dev = ["pytest>=8"]

[project.scripts]
spatiality-diff = "spatiality_diff.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatiality_diff"]
